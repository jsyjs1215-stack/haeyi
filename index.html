<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>HAEYI SCHEDULER</title>
<link rel="manifest" id="manifest-link" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" />
<style>
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin:0; padding:0; }
body { font-family:'Noto Sans KR', sans-serif; background:#FAF8F3; color:#4A4238; min-height:100vh; padding: 20px 16px 56px; }
button, input { font-family: inherit; }
#app { max-width: 720px; margin: 0 auto; }

.header { margin-bottom: 18px; }
.brand-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.brand-title { font-family:'Jua', sans-serif; font-weight:400; font-size:26px; color:#4A4238; margin:0; }
.brand-edit-btn { border:none; background:#F0EAD9; color:#8A7F6E; border-radius:8px; width:26px; height:26px; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; padding:0; }
.brand-edit-input { font-family:'Jua', sans-serif; font-weight:400; font-size:22px; border:none; border-bottom:2px solid #FF6B4A; outline:none; background:transparent; color:#4A4238; padding:2px; width:200px; }
.brand-sub { font-size:12.5px; color:#9C9282; margin:4px 0 0; }

.sync-row { display:flex; align-items:center; gap:8px; margin-top:10px; flex-wrap:wrap; }
.sync-badge { font-size:11px; font-weight:700; padding:4px 10px; border-radius:999px; }
.sync-badge.sync-connecting { background:#F0EAD9; color:#8A7F6E; }
.sync-badge.sync-ok { background:#EAFBF6; color:#0B5C50; }
.sync-badge.sync-warn { background:#FFF7E5; color:#7A4E00; }
.share-btn { border:none; background:#4A4238; color:#fff; border-radius:999px; padding:5px 12px; font-size:11.5px; font-weight:700; cursor:pointer; }
.toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#4A4238; color:#fff; padding:10px 18px; border-radius:999px; font-size:13px; font-weight:600; z-index:200; opacity:0; transition:opacity .2s ease; pointer-events:none; }
.toast.show { opacity:1; }

.kid-tabs { display:flex; gap:7px; flex-wrap:wrap; margin-top:14px; align-items:center; }
.kid-tab { position:relative; display:flex; align-items:center; gap:6px; padding:7px 13px; border-radius:999px; font-weight:600; font-size:13.5px; border:1.5px solid transparent; cursor:pointer; background:#fff; color:#8A7F6E; }
.kid-tab.active { border-color: var(--kc-border); background: var(--kc-bg); color: var(--kc-text); }
.kid-tab .dot { width:7px; height:7px; border-radius:50%; background:var(--kc-border); }
.kid-tab-del { opacity:0.5; margin-left:1px; display:flex; }
.alert-dot { position:absolute; top:-3px; right:-3px; width:12px; height:12px; border-radius:50%; background:#E5383B; border:2px solid #FAF8F3; }
.kid-name-blink { animation: kidNameBlink 1.2s ease-in-out infinite; font-weight:800; }
.kid-share-btn { border:none; background:#FEE500; color:#3C1E1E; height:20px; border-radius:999px; font-size:9.5px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0 6px; flex-shrink:0; gap:1px; }
.kid-share-btn.arrival { background:#FFD6D6; }
.kid-share-btn.hw { background:#FEE500; }
@keyframes kidNameBlink {
  0%, 100% { opacity:1; }
  50% { opacity:0.35; color:#E5383B; }
}
.add-kid-btn { display:flex; align-items:center; gap:5px; padding:7px 13px; border-radius:999px; border:1.5px dashed #D8CBAE; color:#8A7F6E; background:transparent; font-size:13.5px; font-weight:600; cursor:pointer; }
.add-kid-inline { display:flex; gap:6px; align-items:center; }
.add-kid-inline input { border:1.5px solid #D8CBAE; border-radius:999px; padding:6px 12px; font-size:16px; outline:none; width:120px; }
.add-kid-inline button { border:none; background:#FF6B4A; color:#fff; border-radius:999px; padding:6px 13px; font-size:12.5px; font-weight:600; cursor:pointer; }

.empty-state { background:#fff; border:2px dashed #DCD3C0; border-radius:22px; padding:40px 20px; text-align:center; color:#9C9282; margin-top:18px; }
.empty-state h3 { font-family:'Jua', sans-serif; font-weight:400; font-size:18px; color:#4A4238; margin:0 0 6px; }

.view-switch { display:flex; flex-wrap:wrap; gap:3px; background:#F0EAD9; padding:4px; border-radius:20px; width:fit-content; margin:16px 0 14px; max-width:100%; }
.mode-toggle { display:flex; gap:3px; background:#F0EAD9; padding:3px; border-radius:999px; width:fit-content; margin:0 14px 10px; }
.mode-toggle button { border:none; background:transparent; padding:6px 14px; border-radius:999px; font-size:12px; font-weight:600; color:#8A7F6E; cursor:pointer; }
.mode-toggle button.active { background:#fff; color:#4A4238; box-shadow:0 1px 2px rgba(0,0,0,0.06); }
.tab-badge { display:inline-flex; align-items:center; justify-content:center; min-width:15px; height:15px; padding:0 4px; border-radius:999px; background:#E5383B; color:#fff; font-size:9px; font-weight:800; vertical-align:middle; }
.view-btn { border:none; background:transparent; padding:8px 14px; border-radius:999px; font-size:13px; font-weight:600; color:#8A7F6E; cursor:pointer; white-space:nowrap; }
.view-btn.active { background:#FF6B4A; color:#fff; }
.view-btn.tab-alert:not(.active) { animation: tabPulse 1.6s ease-in-out infinite; }
@keyframes tabPulse {
  0%, 100% { background:transparent; color:#8A7F6E; }
  50% { background:#FFD2D2; color:#991B1B; }
}

.panel { background:#fff; border-radius:20px; border:1px solid #F0EAD9; overflow:hidden; box-shadow:0 3px 12px rgba(154,130,80,0.06); }

.hw-add-form { margin:14px 14px 0; background:#FBF9F4; border-radius:14px; padding:12px 14px; }
.hw-add-form .time-row input[type="date"] { border:1.5px solid #E8DFCB; border-radius:11px; padding:8px 10px; font-size:16px; font-family:inherit; }
.hw-add-form .time-row input:not([type="date"]) { border:1.5px solid #E8DFCB; border-radius:11px; padding:8px 10px; font-size:16px; font-family:inherit; outline:none; flex:1; min-width:0; }
.hw-tab-empty { text-align:center; color:#B5AA96; padding:22px 14px; font-size:13px; }
.hw-tab-list { display:flex; flex-direction:column; gap:8px; padding:0 14px 14px; }
.hw-tab-item { border-radius:14px; background:#FBF9F4; border-left:4px solid #E8DFCB; padding:10px 12px; }
.hw-tab-item.pending { border-left-color:#E5383B; background:#FDEAEA; }
.hw-tab-item.done { border-left-color:#14B8A0; background:#EAFBF6; opacity:0.85; }
.hw-tab-main { display:flex; align-items:center; gap:8px; }
.hw-tab-dot { width:9px; height:9px; border-radius:50%; flex-shrink:0; border:1px solid rgba(255,255,255,0.8); }
.hw-tab-body { flex:1; min-width:0; }
.hw-tab-date { font-size:11.5px; font-weight:700; color:#4A4238; }
.hw-tab-text { font-size:12.5px; color:#6B6153; margin-top:2px; }
.hw-tab-text.placeholder { color:#B5AA96; font-style:italic; }
.hw-tab-actions { margin-top:6px; text-align:right; }

.week-toolbar { display:flex; align-items:center; gap:8px; padding:13px 14px; border-bottom:1px solid #F0EAD9; flex-wrap:wrap; }
.week-nav { display:flex; gap:4px; }
.week-nav button { border:1px solid #E8DFCB; background:#fff; border-radius:10px; width:28px; height:28px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#8A7F6E; flex-shrink:0; }
.week-label { font-family:'Jua', sans-serif; font-weight:400; font-size:14.5px; }
.today-btn { margin-left:auto; border:1px solid #E8DFCB; background:#fff; color:#8A7F6E; border-radius:999px; padding:5px 11px; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; }

.legend { display:flex; gap:12px; padding:10px 14px 0; flex-wrap:wrap; font-size:11px; color:#8A7F6E; }

.cal-grid { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:4px; padding:12px 6px 16px; }
.cal-dow { text-align:center; font-size:11px; font-weight:800; color:#8A7F6E; padding-bottom:2px; }
.cal-cell { display:flex; flex-direction:column; align-items:center; min-height:70px; min-width:0; max-width:100%; border-radius:10px; padding:4px 1px 18px; cursor:pointer; position:relative; overflow:hidden; }
.cal-cell:hover { background:#F5EFDE; }
.cal-date-circle { position:relative; width:24px; height:24px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11.5px; font-weight:800; color:#4A4238; margin-bottom:3px; flex-shrink:0; }
.cal-date-circle.today { background:#FF6B4A; color:#fff; box-shadow:0 0 0 3px #FFF1EC; }
.cal-date-circle.holiday { color:#E5383B; }
.cal-cell.out { opacity:0.4; }
.cal-day-dot { position:absolute; top:-2px; right:-3px; width:8px; height:8px; border-radius:50%; border:1.5px solid #FAF8F3; background:#E5383B; }
.cal-pill-list { display:flex; flex-direction:column; gap:3px; width:100%; min-width:0; }
.cal-pill { display:flex; align-items:center; gap:2px; font-size:8.5px; font-weight:700; border-radius:6px; padding:2px 4px; line-height:1.4; box-shadow:0 0 0 1px rgba(255,255,255,0.9); min-width:0; max-width:100%; }
.cal-pill-text { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; flex:1 1 auto; }
.cal-pill-dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; border:1px solid rgba(255,255,255,0.8); }
.cal-pill-note { background:#F0EEE8; color:#8A7F6E; }
.cal-pill-closed { background:#F0EDE6; color:#9C9282; text-decoration:line-through; }
.cal-pill-holiday { background:#FFE0E0; color:#C0392B; text-decoration:line-through; }
.cal-pill-vacation { background:#E3EDF5; color:#4A6785; text-decoration:line-through; }
.cal-pill-hw { display:inline-block; width:6px; height:6px; border-radius:50%; background:#E5383B; border:1px solid #fff; margin-left:3px; flex-shrink:0; }
.cal-add-btn { position:absolute; bottom:2px; right:2px; width:15px; height:15px; border-radius:50%; border:none; background:#F0EAD9; color:#8A7F6E; font-size:10px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; padding:0; }
.note-list { display:flex; flex-direction:column; gap:6px; max-height:220px; overflow-y:auto; }
.note-item { display:flex; justify-content:space-between; align-items:center; gap:8px; background:#FBF9F4; border-radius:10px; padding:8px 10px; font-size:13px; }
.dup-group { background:#FDEAEA; border-radius:12px; padding:10px 12px; margin-bottom:10px; }
.dup-group-title { font-size:12px; font-weight:700; color:#8A1B18; margin-bottom:6px; }
.dup-item { display:flex; justify-content:space-between; align-items:center; gap:8px; background:#fff; border-radius:10px; padding:8px 10px; font-size:12px; margin-bottom:5px; }
.dup-item:last-child { margin-bottom:0; }
.dup-btn { position:relative; }
.holiday-section { background:#FDEAEA; border-radius:12px; padding:10px 12px; margin-bottom:10px; }
.holiday-section.active { display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:12.5px; color:#8A1B18; }
.holiday-section .field-hint { color:#8A1B18; }
.holiday-section input { border:1.5px solid #F0C9C9; border-radius:11px; padding:8px 10px; font-size:16px; font-family:inherit; outline:none; flex:1; }
.note-del { border:none; background:none; color:#B5AA96; cursor:pointer; font-size:12px; flex-shrink:0; }
.legend-item { display:flex; align-items:center; gap:4px; }
.legend-dot { width:9px; height:9px; border-radius:50%; display:inline-block; }

.tt-grid { display:grid; padding:0 8px 4px; }
.tt-daycol-header { text-align:center; padding:8px 4px; border-left:1px solid #F1E9D8; border-bottom:1px solid #F1E9D8; cursor:pointer; }
.tt-daycol-header.is-today { background:#FFF1EC; border-bottom:2px solid #FF6B4A; }
.tt-dh-name { font-size:12.5px; font-weight:800; color:#8A7F6E; position:relative; display:inline-block; }
.tt-dh-name.today { color:#FF6B4A; }
.tt-dh-date { font-size:10px; color:#B5AA96; }
.tt-time-col { position:relative; }
.tt-time-label { position:absolute; right:4px; transform:translateY(-50%); font-size:9.5px; color:#B5AA96; }
.tt-daycol { position:relative; border-left:1px solid #F5EFDD; cursor:copy;
  background-image: repeating-linear-gradient(to bottom, transparent, transparent 45px, #FBF6EA 45px, #FBF6EA 46px); }
.class-block { position:absolute; left:2px; right:2px; border-radius:9px; border:1.5px solid var(--cb-border); background:var(--cb-bg); padding:4px 6px; overflow:hidden; cursor:pointer; }
.class-block.att-present { border-width:3px; box-shadow:inset 0 0 0 1px rgba(14,156,122,0.15); }
.class-block.att-early { border-width:3px; box-shadow:inset 0 0 0 1px rgba(217,140,0,0.15); }
.class-block.one-off { border-style:dashed; }
.class-block.absent { border-width:2.5px; box-shadow:0 1px 4px rgba(229,56,59,0.45); z-index:2; }
.class-block .cb-title { font-size:11px; font-weight:700; color:var(--cb-text); line-height:1.2; }
.class-block .cb-time { font-size:9.5px; font-weight:800; color:var(--cb-text); opacity:1; }
.class-block .cb-status { font-size:8.5px; font-weight:700; color:var(--cb-text); margin-top:1px; opacity:0.9; }

.day-tabs { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px; padding:13px 12px 10px; }
.day-tab { min-width:0; display:flex; flex-direction:column; align-items:center; gap:2px; padding:9px 4px; border-radius:13px; border:1.5px solid #F0EAD9; background:#fff; cursor:pointer; font-weight:700; font-size:14px; color:#8A7F6E; position:relative; }
.day-tab.is-today { border-color:#FF6B4A; border-width:2px; }
.day-tab.is-today:not(.active) { background:#FFF1EC; }
.today-mark { position:absolute; top:-9px; left:50%; transform:translateX(-50%); background:#FF6B4A; color:#fff; font-size:8.5px; font-weight:800; padding:1px 6px; border-radius:999px; white-space:nowrap; }
.day-tab.active { border-color: var(--kc-border); background: var(--kc-soft); color: var(--kc-text); }
.day-tab .tab-date { font-size:9px; font-weight:600; color:#B5AA96; }

.sched-header { display:flex; justify-content:space-between; align-items:center; padding:4px 14px 10px; flex-wrap:wrap; gap:8px; }
.sched-header .daylabel { font-family:'Jua', sans-serif; font-weight:400; font-size:15px; }
.recur-tag { font-size:10px; font-weight:700; padding:2px 7px; border-radius:999px; margin-left:4px; }
.recur-tag.fixed { background:#EAF6FF; color:#0E4A78; }
.recur-tag.once { background:#FFF1EC; color:#99311C; }
.add-class-btn { display:flex; align-items:center; gap:5px; border:none; background: var(--kc-border); color:#fff; padding:8px 14px; border-radius:999px; font-size:12.5px; font-weight:600; cursor:pointer; white-space:nowrap; }

.day-list { padding:0 14px 16px; display:flex; flex-direction:column; gap:9px; }
.day-row-wrap { border-radius:15px; background:#FBF9F4; border-left:5px solid #E8DFCB; }
.day-row-wrap.closed-row { background:#F0EDE6; border-left-color:#B5AA96; }
.day-row-wrap.closed-row .day-row-main { padding:11px 12px; gap:6px; }
.day-row-wrap.closed-row .row-title { color:#8A7F6E; }
.day-row-wrap.closed-holiday { background:#FFE0E0; border-left-color:#C0392B; }
.day-row-wrap.closed-holiday .row-title { color:#C0392B; }
.day-row-wrap.closed-vacation { background:#E3EDF5; border-left-color:#4A6785; }
.day-row-wrap.closed-vacation .row-title { color:#4A6785; }
.recur-tag.holiday-tag { background:#FDD9D9; color:#8A1B18; }
.recur-tag.vacation-tag { background:#D6ECFF; color:#0E4A78; }
.closed-toggle { border:1.5px solid #D8CBAE; background:#fff; color:#8A7F6E; border-radius:999px; padding:6px 10px; font-size:10.5px; font-weight:700; cursor:pointer; flex-shrink:0; white-space:nowrap; }
.closed-clear { border:none; background:none; color:#B0342F; font-size:10.5px; font-weight:700; text-decoration:underline; cursor:pointer; flex-shrink:0; white-space:nowrap; padding:0; }
.closed-label { font-size:11.5px; font-weight:700; color:#B5AA96; flex-shrink:0; }
.mark-closed-btn { border:1.5px solid #E8DFCB; background:#fff; color:#B5AA96; border-radius:50%; width:26px; height:26px; font-size:12px; cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center; padding:0; }
.day-row-wrap.status-출석 { background:#EAFBF6; border-left-color:#14B8A0; }
.day-row-wrap.status-결석 { background:#FDE4E4; border-left-width:7px; border-left-color:#E5383B; box-shadow:0 1px 4px rgba(229,56,59,0.25); }
.day-row-wrap.status-조퇴 { background:#FFF7E5; border-left-color:#F4A200; }
.day-row-main { display:flex; align-items:center; gap:10px; padding:11px 12px 6px; }
.row-time { font-size:13px; color:#4A4238; font-weight:800; width:76px; flex-shrink:0; }
.row-time.dep { width:84px; }
.cls-time { display:block; color:#4A4238; font-weight:800; font-size:13px; line-height:1.3; }
.dep-time { display:block; font-size:10px; color:#FF6B4A; font-weight:700; margin-top:2px; }
.row-body { flex:1; min-width:0; cursor:pointer; }
.row-title { font-weight:700; font-size:14px; display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
.row-loc { font-size:11.5px; color:#9C9282; display:flex; align-items:center; gap:3px; margin-top:2px; }
.row-status-label { font-size:11px; font-weight:800; flex-shrink:0; text-align:right; line-height:1.3; }
.row-time-mark { font-weight:600; opacity:0.85; display:block; font-size:10px; }
.day-empty { padding:24px 14px 32px; text-align:center; color:#B5AA96; font-size:13.5px; }

.hw-row, .prep-row, .reason-row { display:flex; align-items:center; gap:6px; padding:3px 10px; margin:2px 10px 0; border-radius:10px; }
.hw-row.hw-pending { background:#FDEAEA; }
.hw-row.hw-done { background:#EAFBF6; }
.hw-row.hw-none { background:transparent; }
.reason-row { padding:2px 12px; margin:0; }
.reason-input { border-bottom-color:#F3B8B8 !important; }
.reason-input:focus { border-bottom-color:#E5383B !important; }
.prep-row { padding:2px 12px 11px; margin:0; }
.mini-label { font-size:9.5px; font-weight:700; color:#B5AA96; flex-shrink:0; width:28px; }
.hw-accent-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.hw-stamp { flex-shrink:0; border:1.5px solid; border-radius:999px; padding:5px 11px; font-size:10.5px; font-weight:700; cursor:pointer; white-space:nowrap; }
.hw-check { width:19px; height:19px; border-radius:6px; border:1.5px solid #D8CBAE; background:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer; flex-shrink:0; color:#fff; padding:0; }
.hw-check.done { background:#14B8A0; border-color:#14B8A0; }
.hw-input { flex:1; min-width:0; border:none; background:transparent; font-size:16px; padding:3px 0; outline:none; color:#4A4238; border-bottom:1px dashed #E2D9C4; }
.hw-textarea { resize:none; overflow:hidden; font-family:inherit; line-height:1.35; white-space:pre-wrap; word-break:break-word; min-height:32px; }
.hw-input::placeholder { color:#C7BCA3; }
.hw-input.done { text-decoration:line-through; color:#B5AA96; }

.stamp { border:3px solid #E8DFCB; border-radius:50%; font-size:11.5px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; text-align:center; flex-shrink:0; width:50px; height:50px; padding:0; }

.wk-grid { display:grid; gap:2px; padding:2px 10px 10px; align-items:center; }
.wk-subsection-label { font-size:10.5px; font-weight:700; color:#B5AA96; padding:8px 14px 0; }
.wk-grid-cell { display:flex; align-items:center; justify-content:center; min-width:0; padding:5px 1px; font-size:11px; color:#B5AA96; }
.wk-grid-label { justify-content:flex-start; font-weight:700; font-size:10.5px; color:#4A4238; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; padding-left:2px; }
.wk-grid-head { font-size:10px; color:#B5AA96; font-weight:700; line-height:1.4; text-align:center; }
.wk-grid-empty { grid-column:1 / -1; color:#B5AA96; text-align:center; padding:14px 0; font-size:12px; }
.wk-dot { width:20px; height:20px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; font-size:8.5px; font-weight:700; border:1.5px solid #F0EAD9; color:#DCD3C0; flex-shrink:0; }
.section-label { font-size:12.5px; font-weight:700; color: var(--kc-border); padding:10px 14px 0; }

/* ---------- 날짜 유틸 ---------- */
function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function dateToStr(d){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

function timeToMin(t){ var p = t.split(":"); return parseInt(p[0],10)*60 + parseInt(p[1],10); }

function departureTime(c){
  var mins = Number(c.travelMin);
  if (!mins || mins <= 0) return null;
  return minToTime(timeToMin(c.start) - mins);

function mondayIndex(dateStr){ var d = new Date(dateStr+"T00:00:00"); return (d.getDay()+6)%7; }
function getWeekDates(dateStr){
  var d = new Date(dateStr+"T00:00:00");
  var idx = (d.getDay()+6)%7;
  var monday = new Date(d); monday.setDate(d.getDate()-idx);
  var out = [];
  for (var i=0;i<7;i++){ var dd = new Date(monday); dd.setDate(monday.getDate()+i); out.push(dateToStr(dd)); }

/* ---------- 동기화 (Firebase Realtime Database, 로그인 불필요 — 부모님이 최초 1회만 설정) ---------- */
var fbUrl = null;
var lastSyncError = "";
function errText(e){ return (e && e.message) ? e.message : String(e); }
function getFbUrlFromHash(){
  var m = location.hash.match(/fb=([^&]+)/);
  return m ? decodeURIComponent(m[1]) : null;
}
function normalizeFbUrl(u){
  u = (u || "").trim();
  if (u.slice(-1) !== "/") u += "/";
  return u;
}
function remoteGet(){
  return fetch(fbUrl + "family-data.json", { cache:"no-store" }).then(function(res){
    if (!res.ok) throw new Error("데이터 조회 실패 (status " + res.status + ")");
    return res.text();
  }).then(function(text){
    if (!text || text === "null") return null;
    return text;
  });
}
// 전체 데이터 대신 updatedAt 숫자 하나만 받아와서 바뀌었는지 확인 (폴링 트래픽 절감)
function remoteGetTs(){
  return fetch(fbUrl + "family-data/updatedAt.json", { cache:"no-store" }).then(function(res){
    if (!res.ok) throw new Error("데이터 조회 실패 (status " + res.status + ")");
    return res.json();
  }).then(function(v){ return Number(v) || 0; });
}
function remoteSet(text){
  return fetch(fbUrl + "family-data.json?print=silent", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: text
  }).then(function(res){
    if (!res.ok) throw new Error("데이터 저장 실패 (status " + res.status + ")");
  });
}
// 바뀐 항목만 전송 — 다른 기기가 동시에 체크한 출석·숙제를 덮어쓰지 않음
function remotePatch(text){
  return fetch(fbUrl + "family-data.json?print=silent", {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: text
  }).then(function(res){
    if (!res.ok) throw new Error("데이터 저장 실패 (status " + res.status + ")");
  });
}

/* 서버와 마지막으로 맞춘 상태(baseline)를 키별 JSON 문자열로 기억해 두고, 지금 DATA와 비교해 바뀐 부분만 PATCH 한다.
   attendance/homework/supplies는 항목 단위, 나머지는 최상위 키 단위로 비교. */
var MAP_KEYS = { attendance:1, homework:1, supplies:1, requests:1 };
var SAFE_KEY = /^[^.$#\[\]\/]+$/;
var BASE_KEY = "family-schedule-sync-base";
var baseline = null, lastSeenTs = 0;
var initialDone = false, initialRunning = false, saving = false, pollingStarted = false, needsRender = false, syncToastShown = false;

function snapshotOf(d){
  var s = {};
  Object.keys(d).forEach(function(k){
    if (k === "updatedAt" || d[k] === undefined) return;
    if (MAP_KEYS[k] && d[k] && typeof d[k] === "object") {
      var m = s[k] = {};
      Object.keys(d[k]).forEach(function(e){ m[e] = JSON.stringify(d[k][e]); });
    } else s[k] = JSON.stringify(d[k]);
  });
  return s;
}
function diffOps(){
  var ops = {};
  if (!baseline) return ops;
  var keys = {};
  Object.keys(baseline).concat(Object.keys(DATA)).forEach(function(k){ if (k !== "updatedAt") keys[k] = 1; });
  Object.keys(keys).forEach(function(k){
    var cur = DATA[k], base = baseline[k];
    if (MAP_KEYS[k] && cur && typeof cur === "object") {
      var b = (base && typeof base === "object") ? base : {};
      var changed = [];
      Object.keys(cur).forEach(function(e){ if (JSON.stringify(cur[e]) !== b[e]) changed.push([e, cur[e]]); });
      Object.keys(b).forEach(function(e){ if (!(e in cur)) changed.push([e, null]); });
      if (!changed.length) return;
      // Firebase 경로에 쓸 수 없는 문자가 섞인 키가 있으면 그 묶음만 통째로 교체
      if (changed.some(function(c){ return !SAFE_KEY.test(c[0]); })) ops[k] = cur;
      else changed.forEach(function(c){ ops[k+"/"+c[0]] = c[1]; });
    } else {
      var v = cur === undefined ? undefined : JSON.stringify(cur);
      if (v !== base) ops[k] = cur === undefined ? null : cur;
    }
  });
  return ops;
}
function hasLocalChanges(){ return Object.keys(diffOps()).length > 0; }
// stringify=true 이면 baseline(문자열 스냅샷)에, false 이면 실제 데이터 객체에 적용
function applyOps(d, ops, stringify){
  Object.keys(ops).forEach(function(p){
    var v = ops[p], slash = p.indexOf("/");
    if (slash === -1) {
      if (v === null) delete d[p];
      else if (stringify && MAP_KEYS[p]) { var m = {}; Object.keys(v).forEach(function(e){ m[e] = JSON.stringify(v[e]); }); d[p] = m; }
      else d[p] = stringify ? JSON.stringify(v) : v;
    } else {
      var k = p.slice(0, slash), e = p.slice(slash+1);
      if (!d[k] || typeof d[k] !== "object") d[k] = {};
      if (v === null) delete d[k][e];
      else d[k][e] = stringify ? JSON.stringify(v) : v;
    }
  });
}
function saveBaseline(){
  try { localStorage.setItem(BASE_KEY, JSON.stringify({ url:fbUrl, ts:lastSeenTs, snap:baseline })); } catch(e){}
}
function loadBaseline(){
  try {
    var b = JSON.parse(localStorage.getItem(BASE_KEY));
    if (b && b.url === fbUrl && b.snap) { baseline = b.snap; lastSeenTs = b.ts || 0; }
  } catch(e){}
}
function adoptRemote(remote){
  DATA = remote; ensureSelectedKid(); saveLocalBackup(); invalidateIdx();
}
function requestRender(){
  if (isUserTyping()) { needsRender = true; return; }
  render();
}

var saveTimer = null;
function scheduleSave(){
  invalidateIdx();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(doSave, 300);
}
function doSave(){
  clearTimeout(saveTimer); saveTimer = null;
  DATA.updatedAt = Date.now();
  saveLocalBackup();
  if (!fbUrl || !baseline || !initialDone || saving) return;
  if (!hasLocalChanges()) return;
  saving = true;
  remoteGetTs().then(function(ts){
    if (ts === lastSeenTs) return;
    // 그 사이 다른 기기가 저장함 → 서버 최신본을 받아서 그 위에 내 변경분만 다시 얹는다
    return remoteGet().then(function(text){
      var mine = JSON.parse(JSON.stringify(diffOps()));
      if (!text) { baseline = {}; lastSeenTs = 0; return; }
      var remote = normalizeData(JSON.parse(text));
      baseline = snapshotOf(remote);
      lastSeenTs = Number(remote.updatedAt) || 0;
      applyOps(remote, mine, false);
      normalizeData(remote);
      remote.updatedAt = DATA.updatedAt;
      adoptRemote(remote);
      requestRender();
    });
  }).then(function(){
    var ops = diffOps();
    if (!Object.keys(ops).length) return;
    var text = JSON.stringify(Object.assign({}, ops, { updatedAt: DATA.updatedAt }));
    return remotePatch(text).then(function(){
      var sent = JSON.parse(text);
      lastSeenTs = sent.updatedAt;
      delete sent.updatedAt;
      applyOps(baseline, sent, true);
    }, function(e){
      if (!(e instanceof TypeError)) throw e;
      // PATCH 요청이 막히는 환경(브라우저/보안프로그램) → 예전처럼 전체 저장으로 대체
      var full = JSON.stringify(DATA);
      return remoteSet(full).then(function(){
        var d = JSON.parse(full);
        lastSeenTs = Number(d.updatedAt) || 0;
        baseline = snapshotOf(d);
      });
    });
  }).then(function(){
    saving = false;
    saveBaseline();
    syncStatus = "synced"; lastSyncError = ""; renderSyncBadge();
    if (hasLocalChanges()) scheduleSave();
  }).catch(function(e){
    saving = false;
    lastSyncError = errText(e);
    syncStatus = "error"; renderSyncBadge();
  });
}

function isUserTyping(){
  var el = document.activeElement;
  return el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA");
}
function ensureSelectedKid(){
  if (!DATA.kids.length) { ui.selectedKidId = null; return; }
  if (ui.selectedKidId === ALL_KIDS && DATA.kids.length >= 2) return;
  var exists = DATA.kids.some(function(k){ return k.id === ui.selectedKidId; });
  if (!exists) ui.selectedKidId = DATA.kids.length >= 2 ? ALL_KIDS : DATA.kids[0].id;
}
function saveLocalBackup(){
  try { localStorage.setItem("family-schedule-local-backup", JSON.stringify(DATA)); } catch(e){}
}
function pollOnce(){
  if (!fbUrl || saving || ui.modal) return;
  if (!initialDone) { initialSync(); return; }
  remoteGetTs().then(function(ts){
    if (hasLocalChanges()) { doSave(); return; }   // 못 보낸 변경분이 있으면 doSave가 병합까지 처리
    if (ts === lastSeenTs) {
      if (syncStatus === "error") { syncStatus = "synced"; renderSyncBadge(); }
      return;
    }
    return remoteGet().then(function(text){
      if (!text || saving || hasLocalChanges()) return;
      var remote = normalizeData(JSON.parse(text));
      baseline = snapshotOf(remote);
      lastSeenTs = Number(remote.updatedAt) || 0;
      adoptRemote(remote); saveBaseline();
      syncStatus = "synced";
      requestRender();
    });
  }).catch(function(e){ lastSyncError = errText(e); syncStatus = "error"; renderSyncBadge(); });
}
var lastTickSig = "", lastTodayStr = todayStr();
function tickSig(){
  return todayStr() + "|" + DATA.kids.map(function(k){ return kidNeedsArrivalAlert(k.id) ? 1 : 0; }).join("");
}
function startPolling(){
  if (pollingStarted) return;
  pollingStarted = true;
  setInterval(function(){
    if (document.hidden || isUserTyping()) return;
    if (needsRender) render();
    pollOnce();
  }, 15000);
  // 학원 시작 시간이 지나면 이름 깜빡임/알림이 화면을 다시 그리지 않아도 뜨도록 1분마다 확인
  setInterval(function(){
    if (document.hidden || isUserTyping() || ui.modal || ui.noteModal || ui.dupModal || ui.showAdminPrompt || ui.needsSetup) return;
    var s = tickSig();
    if (s !== lastTickSig) {
      lastTickSig = s;
      var t = todayStr();
      if (lastTodayStr !== t) { if (ui.dashDate === lastTodayStr) ui.dashDate = t; lastTodayStr = t; }  // 자정 지나면 '오늘' 화면도 다음 날로
      render();
    }
  }, 60000);
  document.addEventListener("visibilitychange", function(){
    if (document.hidden) doSave();
    else pollOnce();
  });
  window.addEventListener("pagehide", function(){ doSave(); });
}

function init(){
  try {
    var backup = localStorage.getItem("family-schedule-local-backup");
    if (backup) DATA = JSON.parse(backup);
  } catch(e){}
  try { ui.selectedKidId = localStorage.getItem(SEL_KID_KEY) || null; } catch(e){}
  normalizeAll();
  ensureSelectedKid();

  fbUrl = getFbUrlFromHash();
  if (!fbUrl) {
    try { fbUrl = localStorage.getItem("family-fb-url"); } catch(e){}
  }
  if (!fbUrl) {
    ui.needsSetup = true;
    render();
    return;
  }
  proceedWithSync();
}

function submitSetup(){
  var v = (ui.setupUrlInput || "").trim();
  if (!v) return;
  fbUrl = normalizeFbUrl(v);
  ui.needsSetup = false;
  proceedWithSync();
}

function proceedWithSync(){
  try { localStorage.setItem("family-fb-url", fbUrl); } catch(e){}
  if (!getFbUrlFromHash()) location.hash = "fb=" + encodeURIComponent(fbUrl);
  render();

  if (!window.fetch) {
    lastSyncError = "이 브라우저는 fetch를 지원하지 않아요.";
    syncStatus = "local-only"; renderSyncBadge();
    return;
  }
  if (!baseline) loadBaseline();
  initialSync();
  startPolling();
}

function initialSync(){
  if (initialRunning) return;
  initialRunning = true;
  syncStatus = "connecting"; renderSyncBadge();
  remoteGet().then(function(text){
    if (!text) {
      return remoteSet(JSON.stringify(DATA)).then(function(){
        baseline = snapshotOf(DATA); lastSeenTs = Number(DATA.updatedAt) || 0;
      });
    }
    var remote = normalizeData(JSON.parse(text));
    // 지난번에 이 기기에서 못 올린 변경분(오프라인 등)이 있으면 서버 최신본 위에 다시 얹는다
    var mine = JSON.parse(JSON.stringify(diffOps()));
    baseline = snapshotOf(remote);
    lastSeenTs = Number(remote.updatedAt) || 0;
    applyOps(remote, mine, false);
    normalizeData(remote);
    adoptRemote(remote);
  }).then(function(){
    initialRunning = false; initialDone = true;
    saveBaseline();
    syncStatus = "synced"; lastSyncError = "";
    requestRender();
    if (!syncToastShown) { syncToastShown = true; showToast("가족과 동기화됐어요! 위의 '공유 링크 복사'를 눌러 가족에게 보내주세요."); }
    if (hasLocalChanges()) doSave();
  }).catch(function(e){
    initialRunning = false;
    lastSyncError = errText(e);
    syncStatus = "error"; renderSyncBadge();
  });
}

var toastTimer = null;
function showToast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show";
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.className = "toast"; }, 3000);
}
function copyShareLink(){
  var url = location.href;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(url).then(function(){
      showToast("링크를 복사했어요! 카카오톡으로 가족에게 보내주세요.");
    }).catch(function(){ showToast("복사에 실패했어요. 주소창의 링크를 직접 복사해주세요."); });
  } else {
    showToast("이 브라우저에서는 자동 복사가 안 돼요. 주소창의 링크를 직접 복사해주세요.");
  }
}

/* ---------- 파생 데이터 헬퍼 ---------- */
function isValidOnDate(c, dateForDay){
  if (c.validFrom && dateForDay < c.validFrom) return false;
  if (c.validUntil && dateForDay > c.validUntil) return false;
  return true;
}
/* 조회용 인덱스: 렌더 한 번에 classesForDay·getHoliday 등이 수백 번 불려서 매번 전체 배열을 훑지 않도록 캐시.
   데이터가 바뀌면(scheduleSave / render / 서버 데이터 수신) 버리고 다시 만든다. */
var IDX = null;
function invalidateIdx(){ IDX = null; }
function idx(){
  if (IDX) return IDX;
  var recur = {}, once = {}, titles = {}, hol = {}, notes = {}, accent = {};
  DATA.classes.forEach(function(c, i){
    var k = c.recurring ? c.kidId+"|"+c.day : c.kidId+"|"+c.date;
    var bucket = c.recurring ? recur : once;
    (bucket[k] = bucket[k] || []).push({ c:c, i:i });
    (titles[c.kidId] = titles[c.kidId] || {})[c.title] = true;
  });
  Object.keys(titles).forEach(function(kid){
    var m = accent[kid] = {};
    Object.keys(titles[kid]).sort().forEach(function(t, i){ m[t] = CLASS_ACCENTS[i % CLASS_ACCENTS.length]; });
  });
  DATA.holidays.forEach(function(h){ if (!hol[h.date]) hol[h.date] = h; });
  DATA.calendarNotes.forEach(function(n){ (notes[n.date] = notes[n.date] || []).push(n); });
  IDX = { recur:recur, once:once, accent:accent, hol:hol, notes:notes, day:{}, hwCount:{} };
  return IDX;
}
function classesForDay(kidId, dayIdx, dateForDay){
  var x = idx(), key = kidId+"|"+dayIdx+"|"+dateForDay;
  if (x.day[key]) return x.day[key];
  var list = (x.recur[kidId+"|"+dayIdx] || []).filter(function(e){ return isValidOnDate(e.c, dateForDay); })
    .concat(x.once[kidId+"|"+dateForDay] || []);
  list.sort(function(a,b){ return (timeToMin(a.c.start) - timeToMin(b.c.start)) || (a.i - b.i); });
  return (x.day[key] = list.map(function(e){ return e.c; }));
}
function notesForDate(dateStr){ return idx().notes[dateStr] || []; }
function weekGroupCount(kidId, dayIdxs, wd){
  var count = 0;
  dayIdxs.forEach(function(i){ count += classesForDay(kidId, i, wd[i]).length; });
  return count;
}
var CLOSED_REASON_CYCLE = [null, "공휴일", "방학"];
function getClosedEntry(c, dateStr){
  if (!c.closedDates) return null;
  return c.closedDates.find(function(e){ return e.date === dateStr; }) || null;
}
function getHoliday(dateStr){
  return idx().hol[dateStr] || null;
}
function isOpenOverride(c, dateStr){
  return !!(c.openOverrides && c.openOverrides.indexOf(dateStr) !== -1);
}
function isClosedOn(c, dateStr){
  if (getClosedEntry(c, dateStr)) return true;
  if (getHoliday(dateStr) && !isOpenOverride(c, dateStr)) return true;
  return false;
}
function getClosedReason(c, dateStr){
  var e = getClosedEntry(c, dateStr);
  if (e) return e.reason;
  var h = getHoliday(dateStr);
  if (h && !isOpenOverride(c, dateStr)) return h.label ? h.label : "공휴일";
  return null;
}
function isClosedByHolidayOnly(c, dateStr){
  return !getClosedEntry(c, dateStr) && !!getHoliday(dateStr) && !isOpenOverride(c, dateStr);
}
var CLASS_ACCENTS = ["#059669","#4338CA","#B45309","#BE123C","#0891B2","#A21CAF","#166534","#334155"];
function classAccentColor(title, kidId){
  var m = idx().accent[kidId];
  return (m && m[title]) || CLASS_ACCENTS[0];
}
function dayHasPendingHomework(kidId, dateStr){
  var items = classesForDay(kidId, mondayIndex(dateStr), dateStr);
  return items.some(function(c){ return !isClosedOn(c, dateStr) && hwStatus(DATA.homework[c.id+"__"+dateStr], c.hwDefault) === "pending"; });
}
function getHomeworkList(kidId, daysBack, daysForward){
  var today = todayStr();
  var results = [];
  for (var offset = -daysBack; offset <= daysForward; offset++){
    var d = shiftDate(today, offset);
    var dayIdx = mondayIndex(d);
    classesForDay(kidId, dayIdx, d).forEach(function(c){
      if (isClosedOn(c, d)) return;
      var hw = DATA.homework[c.id+"__"+d];
      var st = hwStatus(hw, c.hwDefault);
      if (st === "none") return;
      results.push({ source:"class", classId:c.id, title:c.title, date:d, text:(hw?hw.text:""), status:st, accent:classAccentColor(c.title, kidId) });
    });
  }
  DATA.homeworkItems.filter(function(h){ return h.kidId === kidId && h.date <= shiftDate(today, daysForward) && h.date >= shiftDate(today, -daysBack); }).forEach(function(h){
    results.push({ source:"manual", id:h.id, title:"직접 입력", date:h.date, text:h.text, status:h.status, accent:"#8A7F6E" });
  });
  results.sort(function(a,b){ return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
  return results;
}
function homeworkPendingCount(kidId){
  var x = idx();
  if (x.hwCount[kidId] === undefined) x.hwCount[kidId] = getHomeworkList(kidId, 14, 0).filter(function(h){ return h.status === "pending"; }).length;
  return x.hwCount[kidId];
}
function addHomeworkItem(kidId, date, text){
  if (!ui.adminUnlocked) return;
  if (!text || !text.trim()) return;
  DATA.homeworkItems.push({ id:uid(), kidId:kidId, date:date, text:text.trim(), status:"pending" });
  scheduleSave(); render();
}
function toggleHomeworkItemStatus(id){
  DATA.homeworkItems = DATA.homeworkItems.map(function(h){ return h.id === id ? Object.assign({}, h, { status: h.status === "pending" ? "done" : "pending" }) : h; });
  scheduleSave(); render();
}
function toggleClassHwBinary(classId, date){
  var hwKey = classId+"__"+date;
  var cur = DATA.homework[hwKey] || { text:"" };
  var cls = DATA.classes.find(function(c){ return c.id === classId; });
  var hwDefault = cls ? cls.hwDefault : "pending";
  var curStatus = hwStatus(cur, hwDefault);
  var next = curStatus === "done" ? "pending" : "done";
  DATA.homework[hwKey] = Object.assign({}, cur, { status: next, done: next === "done" });
  scheduleSave(); render();
}
function deleteHomeworkItem(id){
  if (!ui.adminUnlocked) return;
  DATA.homeworkItems = DATA.homeworkItems.filter(function(h){ return h.id !== id; });
  scheduleSave(); render();
}
function chipColors(c, status){
  if (status === "결석") return { bg: ABSENT_COLOR.bg, text: ABSENT_COLOR.text };
  return { bg: TYPE_COLOR[c.type].bg, text: TYPE_COLOR[c.type].text };
}
function statusIcon(status){
  if (status === "출석") return "✓ ";
  if (status === "조퇴") return "◐ ";
  return "";
}
// 오늘 시작 시간이 지났는데 출석 체크가 안 된 수업 (학교는 기본이 '출석'이라 제외)
function lateClasses(kidId){
  var today = todayStr();
  var now = new Date();
  var nowMin = now.getHours()*60 + now.getMinutes();
  return classesForDay(kidId, mondayIndex(today), today).filter(function(c){
    if (isClosedOn(c, today)) return false;
    if (timeToMin(c.start) > nowMin) return false;
    return !attDisplayStatus(DATA.attendance[c.id+"__"+today], c.type, today);
  });
}
function kidNeedsArrivalAlert(kidId){ return lateClasses(kidId).length > 0; }
function buildArrivalAlertMessage(kidId){
  var kid = DATA.kids.find(function(k){ return k.id === kidId; });
  if (!kid) return "";
  var lateOnes = lateClasses(kidId);
  if (!lateOnes.length) return "";
  return "⏰ [출석 확인 필요]\n"+kid.name+"이(가) 아직 도착 확인이 안 됐어요: "+lateOnes.map(function(c){ return c.title+"("+c.start+")"; }).join(", ");
}
function buildHomeworkAlertMessage(kidId){
  var kid = DATA.kids.find(function(k){ return k.id === kidId; });
  if (!kid) return "";

function countAttendance(ids, start, end){
  if (!start || !end) return null;
  // 기본이 출석이므로, 기간 안의 실제 수업일(휴무 제외, 오늘까지) 중 결석·조퇴가 아닌 날을 센다
  var classes = DATA.classes.filter(function(c){ return ids.indexOf(c.id) !== -1; });
  var last = end < todayStr() ? end : todayStr();
  var count = 0, d = start, guard = 0;
  while (d <= last && guard < 800){
    var wd = mondayIndex(d);
    classes.forEach(function(c){
      var held = c.recurring ? (c.day === wd && isValidOnDate(c, d)) : c.date === d;
      if (!held || isClosedOn(c, d)) return;
      if (attDisplayStatus(DATA.attendance[c.id+"__"+d], c.type, d) === "출석") count++;
    });
    d = shiftDate(d, 1); guard++;
  }
  return count;
}
function classCycleRange(c){
  if (!c.cycleStart || !c.sessionsPerCycle) return null;
  var siblings = DATA.classes.filter(function(x){ return x.kidId === c.kidId && x.title === c.title && x.type === c.type; });
  var autoWeekdays = Array.from(new Set(siblings.filter(function(x){ return x.recurring; }).map(function(x){ return x.day; }))).sort();
  var effectiveWeekdays = (c.cycleWeekdays && c.cycleWeekdays.length) ? c.cycleWeekdays : autoWeekdays;
  return computeCycleDates(siblings, effectiveWeekdays, c.cycleStart, Number(c.sessionsPerCycle));
}
function classSessionNumber(c, dateForRow){
  if (!c.cycleStart) return null;
  if (dateForRow < c.cycleStart) return null;
  var siblings = DATA.classes.filter(function(x){ return x.kidId === c.kidId && x.title === c.title && x.type === c.type; });
  var recurring = siblings.filter(function(x){ return x.recurring; });
  var autoWeekdays = Array.from(new Set(recurring.map(function(x){ return x.day; }))).sort();
  var effectiveWeekdays = (c.cycleWeekdays && c.cycleWeekdays.length) ? c.cycleWeekdays : autoWeekdays;
  if (!effectiveWeekdays.length) return null;
  function isSessionDay(dateStr, wd){
    if (effectiveWeekdays.indexOf(wd) === -1) return false;
    var dayEntries = recurring.filter(function(e){ return e.day === wd; });
    if (dayEntries.length > 0) return dayEntries.some(function(e){ return !isClosedOn(e, dateStr); });
    return !getHoliday(dateStr);
  }
  var d = new Date(c.cycleStart+"T00:00:00");
  var count = 0, guard = 0;
  while (guard < 500){
    var dateStr = dateToStr(d);
    var wd = (d.getDay()+6)%7;
    if (isSessionDay(dateStr, wd)){
      count++;
      if (dateStr === dateForRow) return count;
    }
    if (dateStr === dateForRow) return null;
    d.setDate(d.getDate()+1);
    guard++;
  }
  return null;
}
function computeCycleDates(entries, weekdays, startDate, sessionCount){
  var recurring = entries.filter(function(e){ return e.recurring; });
  if (!weekdays.length || !startDate || !sessionCount || sessionCount <= 0) return null;
  function isSessionDay(dateStr, wd){
    if (weekdays.indexOf(wd) === -1) return false;
    var dayEntries = recurring.filter(function(e){ return e.day === wd; });
    if (dayEntries.length > 0) return dayEntries.some(function(e){ return !isClosedOn(e, dateStr); });
    return !getHoliday(dateStr);
  }
  var d = new Date(startDate+"T00:00:00");
  var count = 0, lastDate = null, guard = 0;
  while (count < sessionCount && guard < 500){
    var dateStr = dateToStr(d);
    var wd = (d.getDay()+6)%7;
    if (isSessionDay(dateStr, wd)){
      count++;
      lastDate = dateStr;
      if (count === sessionCount) break;
    }
    d.setDate(d.getDate()+1);
    guard++;
  }
  if (!lastDate) return null;
  var nd = new Date(lastDate+"T00:00:00");
  nd.setDate(nd.getDate()+1);
  var guard2 = 0;
  while (guard2 < 60){
    var dateStr2 = dateToStr(nd);
    var wd2 = (nd.getDay()+6)%7;
    if (isSessionDay(dateStr2, wd2)) break;
    nd.setDate(nd.getDate()+1);
    guard2++;
  }
  return { cycleEnd: lastDate, nextCycleStart: dateToStr(nd) };
}
function academyGroups(kidId){
  var today = todayStr();
  var kidClasses = DATA.classes.filter(function(c){ return c.kidId === kidId && c.type === "학원"; });
  var titles = Array.from(new Set(kidClasses.map(function(c){ return c.title; })));
  var thisWeekDates = getWeekDates(today);
  return titles.map(function(title){
    var entries = kidClasses.filter(function(c){ return c.title === title; });
    var first = entries[0];
    var ids = entries.map(function(e){ return e.id; });
    var autoWeeklyCount = entries.filter(function(c){ return c.recurring && !isClosedOn(c, thisWeekDates[c.day]); }).length +
      entries.filter(function(c){ return !c.recurring && thisWeekDates.indexOf(c.date) !== -1; }).length;
    var weeklyCount = (first.weeklyCountOverride !== undefined && first.weeklyCountOverride !== "") ? Number(first.weeklyCountOverride) : autoWeeklyCount;
    var recurringEntry = entries.find(function(c){ return c.recurring; });
    var autoWeekdays = Array.from(new Set(entries.filter(function(c){ return c.recurring; }).map(function(c){ return c.day; }))).sort();
    var cycleWeekdays = (first.cycleWeekdays && first.cycleWeekdays.length) ? first.cycleWeekdays.slice().sort() : [];
    var effectiveWeekdays = cycleWeekdays.length ? cycleWeekdays : autoWeekdays;
    var cycleResult = computeCycleDates(entries, effectiveWeekdays, first.cycleStart, Number(first.sessionsPerCycle));
    return {
      title:title, type:first.type, ids:ids, fee:first.fee, dueDate:first.dueDate, paid:first.paid, paidDate:first.paidDate,
      weeklyCount:weeklyCount, autoWeeklyCount:autoWeeklyCount, weeklyCountOverride:first.weeklyCountOverride||"",
      countStart:first.countStart||"", countEnd:first.countEnd||"",
      attendanceCount: countAttendance(ids, first.countStart, first.countEnd),
      validFrom: recurringEntry ? recurringEntry.validFrom : null,
      validUntil: recurringEntry ? recurringEntry.validUntil : null,
      cycleStart:first.cycleStart||"", sessionsPerCycle:first.sessionsPerCycle||"",
      cycleEnd: cycleResult ? cycleResult.cycleEnd : "", nextCycleStart: cycleResult ? cycleResult.nextCycleStart : "",
      autoWeekdays:autoWeekdays, cycleWeekdays:cycleWeekdays, effectiveWeekdays:effectiveWeekdays
    };
  });
}

function monthGrid(calRef){
  var d = new Date(calRef+"T00:00:00");
  var year = d.getFullYear(), month = d.getMonth();
  var firstOfMonth = new Date(year, month, 1);
  var firstWeekday = (firstOfMonth.getDay()+6)%7;
  var gridStart = new Date(year, month, 1 - firstWeekday);
  var cells = [];
  for (var i=0;i<42;i++){
    var dd = new Date(gridStart); dd.setDate(gridStart.getDate()+i);
    cells.push({ date: dateToStr(dd), inMonth: dd.getMonth()===month });
  }
  while (cells.length > 35 && cells.slice(-7).every(function(c){ return !c.inMonth; })) cells = cells.slice(0,-7);
  return { year:year, month:month, cells:cells };
}

// 시간이 겹치는 블록끼리는 칸을 나눠 옆으로 나란히 배치 (items는 시작시간 순)
function layoutLanes(items){
  var res = {}, cluster = null, clusterEnd = -1;
  items.forEach(function(c){
    var s = timeToMin(c.start), e = Math.max(timeToMin(c.end), s + 40); // 블록 최소 높이(30px ≈ 40분) 고려
    if (!cluster || s >= clusterEnd) { cluster = { lanes:[] }; clusterEnd = -1; }
    var lane = 0;
    while (lane < cluster.lanes.length && cluster.lanes[lane] > s) lane++;
    cluster.lanes[lane] = e;
    clusterEnd = Math.max(clusterEnd, e);
    res[c.id] = { lane:lane, cluster:cluster };
  });
  return function(id){ var r = res[id]; return { lane:r.lane, n:r.cluster.lanes.length }; };
}
// 칸 안에서의 가로 위치. "모두" 보기에선 아이마다 고정된 세로 칸(왼쪽부터 아이 순서)을 쓰고, 그 안에서 겹치면 다시 나눈다
function laneStyle(kidSlot, kidCount, lane, n){
  var total = kidCount * n;
  if (total <= 1) return { style:"", narrow:false };
  var left = (kidSlot + lane / n) * 100 / kidCount, width = 100 / total;
  return { style:"left:calc("+left+"% + 1px);width:calc("+width+"% - 2px);right:auto;", narrow:true };
}

/* ---------- 🎒 준비물 탭: 아이들이 준비물·사줄 물건을 요청하고, 부모님이 챙기면 체크 ---------- */
var CLASS_SUPPLY_DAYS = 7;   // 수업 줄에 적힌 준비물은 앞뒤 7일 것만 모아서 보여줌
function requestItems(kidId){
  return Object.keys(DATA.requests).map(function(id){ return Object.assign({ id:id, source:"request" }, DATA.requests[id]); })
    .filter(function(r){ return r.kidId === kidId; });
}
// 수업 줄의 '준비물' 칸에 적힌 것들도 함께 모음
function classSupplyItems(kidId){
  var from = shiftDate(todayStr(), -CLASS_SUPPLY_DAYS), to = shiftDate(todayStr(), CLASS_SUPPLY_DAYS);
  var out = [];
  Object.keys(DATA.supplies).forEach(function(key){
    var s = DATA.supplies[key];
    if (!s || !s.text || !String(s.text).trim()) return;
    var i = key.indexOf("__"), cid = key.slice(0, i), date = key.slice(i + 2);
    if (date < from || date > to) return;
    var c = DATA.classes.find(function(x){ return x.id === cid; });
    if (!c || c.kidId !== kidId) return;
    out.push({ source:"class", classId:cid, date:date, kidId:kidId, kind:"prep", text:s.text, status: s.done ? "done" : "open", classTitle:c.title });
  });
  return out;
}
function openRequestItems(kidId){
  return requestItems(kidId).concat(classSupplyItems(kidId)).filter(function(r){ return r.status !== "done"; })
    .sort(function(a,b){ return (a.due||"9999") < (b.due||"9999") ? -1 : (a.due||"9999") > (b.due||"9999") ? 1 : (a.createdAt||0) - (b.createdAt||0); });
}
function openRequestCount(kidId){ return openRequestItems(kidId).length; }
function openSuppliesFor(kidId){
  ui.selectedKidId = kidId;
  try { localStorage.setItem(SEL_KID_KEY, kidId); } catch(e){}
  goToView("supplies");
}
function reqSet(field, value, rerender){ ui[field] = value; if (rerender) render(); }
function addRequest(){
  var text = (ui.reqText || "").trim();
  if (!text) { showToast("무엇이 필요한지 적어주세요!"); return; }
  var kidId = isAllKids() ? ((ui.reqKidId && kidById(ui.reqKidId)) ? ui.reqKidId : DATA.kids[0].id) : ui.selectedKidId;
  DATA.requests[uid()] = { kidId:kidId, text:text, kind: ui.reqKind || "prep", due: ui.reqDue || "", status:"open", createdAt: Date.now(), doneDate:"" };
  ui.reqText = ""; ui.reqDue = "";
  scheduleSave(); render();
  showToast("요청했어요! 엄마·아빠 화면에도 바로 보여요.");
}
function toggleRequest(id){
  var r = DATA.requests[id];
  if (!r) return;
  var done = r.status !== "done";
  DATA.requests[id] = Object.assign({}, r, { status: done ? "done" : "open", doneDate: done ? todayStr() : "" });
  scheduleSave(); render();
}
function deleteRequest(id){
  var r = DATA.requests[id];
  if (!r || !confirm('"'+r.text+'" 요청을 지울까요?')) return;
  delete DATA.requests[id];
  scheduleSave(); render();
}
function shareRequests(kidIdsStr){
  var lines = kidIdsStr.split(",").map(function(kidId){
    var k = kidById(kidId), items = openRequestItems(kidId);
    if (!k || !items.length) return "";
    return k.name+": "+items.map(function(r){ return (r.kind==="buy"?"🛒":"🎒")+r.text+(r.due?"("+formatMD(r.due)+"까지)":""); }).join(", ");
  }).filter(Boolean);
  if (!lines.length) { showToast("요청한 준비물이 없어요."); return; }
  shareText("🎒 [준비물·사주세요 요청]\n"+lines.join("\n"));
}
function reqDueLabel(r){
  if (!r.due) return "언제든";
  var t = todayStr();
  if (r.status !== "done" && r.due < t) return '<b style="color:#C0392B">⚠️ '+formatMD(r.due)+'까지였어요</b>';
  if (r.due === t) return '<b style="color:#C0392B">오늘까지</b>';
  if (r.due === shiftDate(t, 1)) return '<b style="color:#D98C00">내일까지</b>';
  return formatMD(r.due)+'까지';
}
function renderRequestRow(r){
  var done = r.status === "done";
  var icon = r.source === "class" ? "📚" : (r.kind === "buy" ? "🛒" : "🎒");
  var meta = r.source === "class"
    ? esc(r.classTitle)+' 수업('+formatMD(r.date)+')에서 적음'
    : reqDueLabel(r) + (r.createdAt ? ' · '+formatMD(dateToStr(new Date(r.createdAt)))+' 요청' : '') + (done && r.doneDate ? ' · '+formatMD(r.doneDate)+' 완료' : '');
  var toggle = r.source === "class" ? "toggleSuppliesDone('"+r.classId+"','"+r.date+"')" : "toggleRequest('"+r.id+"')";
  var label = done ? "되돌리기" : (r.kind === "buy" ? "샀어요 ✓" : "챙겼어요 ✓");
  var overdue = !done && r.due && r.due < todayStr();
  return '<div class="req-item'+(done?" done":"")+(overdue?" overdue":"")+(r.kind==="buy"&&!done?" buy":"")+'">' +
    '<span class="req-icon">'+icon+'</span>' +
    '<div class="req-body"><div class="req-text">'+esc(r.text)+'</div><div class="req-meta">'+meta+'</div></div>' +
    '<button class="req-done-btn'+(done?" undo":"")+'" onclick="'+toggle+'">'+label+'</button>' +
    (r.source === "request" ? '<button class="req-del" title="지우기" onclick="deleteRequest(\''+r.id+'\')">✕</button>' : '') +
    '</div>';
}

  var sections = kidsShown.map(function(k){

    var head = isAllKids() ? kidSectionHead(k, open.length ? '<span class="ks-extra" style="color:#0E4A78">요청 '+open.length+'개</span>' : '<span class="ks-extra">✓ 다 챙겼어요</span>') : '';
    return head +
      (open.length ? '<div class="req-list">'+open.map(renderRequestRow).join("")+'</div>' : '<div class="hw-tab-empty">필요한 게 생기면 위에 적어주세요 🙂</div>') +
      (done.length ? '<div class="section-label" style="margin-top:6px;color:#8A7F6E">완료 (최근 7일)</div><div class="req-list">'+done.map(renderRequestRow).join("")+'</div>' : '');

        (g.effectiveWeekdays.length > 0 && g.cycleStart && g.sessionsPerCycle ? '<div class="pay-cycle-warn">⚠️ 계산이 안 되고 있어요. 시작일·횟수·요일을 다시 확인해주세요.</div>' : '')) +

function renderDuplicateModal(){
  if (!ui.dupModal) return "";
  var groups = findDuplicateGroups();

  if (groups.length === 0) {
    content = '<div class="day-empty">중복된 일정이 없어요. 깨끗해요! 🎉</div>';
  } else {
    content = groups.map(function(g){
      var kid = DATA.kids.find(function(k){ return k.id === g[0].kidId; });
      var kidName = kid ? kid.name : "?";
      var whenLabel = g[0].recurring ? (DAYS[g[0].day]+'요일 매주') : formatKoreanDate(g[0].date);
      var items = g.map(function(c){
        return '<div class="dup-item"><span>'+esc(c.title)+' · '+whenLabel+' '+c.start+'–'+c.end+(c.location?' · 📍'+esc(c.location):'')+'</span>' +
          '<button class="closed-clear" onclick="deleteDuplicateEntry(\''+c.id+'\')">이 항목 삭제</button></div>';
      }).join("");
      return '<div class="dup-group"><div class="dup-group-title">👤 '+esc(kidName)+' — 중복 '+g.length+'개 발견</div>'+items+'</div>';
    }).join("");
  }

  var crossMatches = findCrossKidMatches();
  var crossContent = "";
  if (crossMatches.length > 0) {
    crossContent = '<div class="section-label" style="color:#B0342F;margin-top:14px">⚠️ 여러 아이에게 똑같이 걸린 일정</div>' +
      '<div class="field-hint" style="margin:2px 0 8px">아래는 서로 다른 아이인데 이름·요일·시간이 완전히 같은 일정들이에요. 진짜 같이 다니는 학원이면 괜찮지만, 실수로 섞인 거라면 해당 아이가 아닌 쪽을 지워주세요.</div>' +
      crossMatches.map(function(g){
        var whenLabel = g[0].recurring ? (DAYS[g[0].day]+'요일 매주') : formatKoreanDate(g[0].date);
        var items = g.map(function(c){
          var kid = DATA.kids.find(function(k){ return k.id === c.kidId; });
          return '<div class="dup-item"><span>👤 '+esc(kid?kid.name:"?")+' · '+esc(c.title)+' · '+whenLabel+' '+c.start+'–'+c.end+'</span>' +
            '<button class="closed-clear" onclick="deleteDuplicateEntry(\''+c.id+'\')">이 항목 삭제</button></div>';
        }).join("");
        return '<div class="dup-group" style="background:#FFF3E0">'+items+'</div>';
      }).join("");
  }

  return '<div class="modal-overlay" onclick="closeDuplicateModal()"><div class="modal" onclick="event.stopPropagation()">' +
    '<h3>🧹 중복 일정 정리<button class="modal-close" onclick="closeDuplicateModal()">✕</button></h3>' +
    '<div class="field-hint" style="margin-bottom:10px">같은 아이·이름·요일(또는 날짜)·시간이 완전히 겹치는 일정들이에요. 필요 없는 걸 지워서 하나만 남겨주세요.</div>' +
    content + crossContent +
    '</div></div>';
}

/* ---------- 시작 ---------- */
var resizeTimer = null;
window.addEventListener("resize", function(){ clearTimeout(resizeTimer); resizeTimer = setTimeout(fitTextareas, 150); });
init();
</script>
</body>
</html>
